name: Costruisci APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      # Genera il progetto Android nativo a partire dalla configurazione Expo
      - run: npx expo prebuild -p android --no-install
      - name: Compila l'APK
        working-directory: android
        run: |
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log; then
            # Riporta l'errore di Gradle come annotazione, leggibile senza scaricare i log
            grep -E "What went wrong|error:|ERROR:|Exception" -A8 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - run: cp android/app/build/outputs/apk/release/app-release.apk studio-psicologo.apk
      - name: Pubblica come release scaricabile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.2.${{ github.run_number }}" studio-psicologo.apk \
            --title "PsicoLab 1.2.${{ github.run_number }}" \
            --notes "APK Android da installare sul telefono. Link fisso all'ultima versione: https://github.com/${{ github.repository }}/releases/latest/download/studio-psicologo.apk" \
            --latest
